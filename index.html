<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Extractor & Summarizer</title>
    <meta name="description" content="Upload any PDF, instantly extract its text, and generate beautifully formatted, structured summaries using Step-3.7-Flash AI." />
    <meta property="og:title" content="PDF Extractor & Summarizer" />
    <meta property="og:description" content="Upload any PDF, instantly extract its text, and generate beautifully formatted, structured summaries using Step-3.7-Flash AI." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- PDF.js library from Cloudflare CDN for robust client-side PDF text extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>
      // Apply saved theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem("dwey-theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
