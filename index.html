<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECOLOGIS — Legislative Document Management & AI Summary System</title>
    <meta name="description" content="EcoLegis — Legislative Document Management & AI Summary System. Upload legislative documents, extract text, and generate AI summaries." />
    <meta property="og:title" content="EcoLegis — Legislative Document Management & AI Summary System" />
    <meta property="og:description" content="EcoLegis — Legislative Document Management & AI Summary System. Upload legislative documents, extract text, and generate AI summaries." />
    <meta property="og:type" content="website" />

    <!-- PDF.js library from Cloudflare CDN for robust client-side PDF text extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <!-- Tesseract.js v5 from jsDelivr CDN for OCR fallback on scanned PDFs -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
      // Apply saved theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem("dwey-theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
